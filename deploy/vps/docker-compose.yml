services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    # No `ports:` on purpose — Redis is reachable only from the compose network.
    # requirepass on top of that, so another container on the same host cannot
    # read or write the executor's queues. REDIS_PASSWORD comes from .env.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  executor:
    image: youruser/p2pme-executor:v0.1.0
    env_file: .env
    environment:
      - REDIS_URL=redis://default:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    # Loopback-only: the executor is a worker, not an API. Nothing outside this
    # host should reach it — put a reverse proxy in front only if you need the
    # healthz probe remotely, and authenticate it there.
    ports:
      - "127.0.0.1:8000:8000"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis_data:
