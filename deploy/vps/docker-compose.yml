services:
  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:16-alpine
    # Prizerail ledger (entrant map, winners, payout state). Loopback-only.
    environment:
      - POSTGRES_USER=executor
      - POSTGRES_PASSWORD=executor
      - POSTGRES_DB=executor
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U executor"]
      interval: 5s
      timeout: 2s
      retries: 5

  executor:
    image: youruser/p2pme-executor:v0.1.0
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgres://executor:executor@postgres:5432/executor
    ports:
      - "127.0.0.1:8000:8000"
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  redis_data:
