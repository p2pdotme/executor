services:
  redis:
    image: redis:7-alpine
    # Loopback-only: nothing outside this host should reach the queue store.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 2s
      retries: 5

  executor:
    build:
      context: ../..
      dockerfile: dockerfile
    env_file: ../../.env
    environment:
      - REDIS_URL=redis://redis:6379
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
